# =============================================================================
#  Phishing Guard V2 — Production Docker Compose
# =============================================================================
#  Usage: docker compose -f docker-compose.prod.yml up -d --build
#
#  Architecture:
#    nginx (port 80) → React SPA (static) + FastAPI (port 8000) → PostgreSQL
# =============================================================================

services:
  # ── Nginx reverse proxy + static file server ────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: pg-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - frontend_dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
    restart: unless-stopped

  # ── FastAPI backend ─────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pg-backend
    expose:
      - "8000"                  # Internal only — nginx forwards to this
    env_file:
      - .env.prod
    volumes:
      - uploads_data:/app/uploads
      - model_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "
        alembic upgrade head &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
      "
    restart: unless-stopped

  # ── Frontend build (one-shot, then nginx serves the dist) ───────────────
  frontend-build:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pg-frontend-build
    volumes:
      - frontend_dist:/app/dist
    # Exits after build — nginx picks up the volume

  # ── PostgreSQL database ─────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: pg-db
    environment:
      POSTGRES_USER: phishing_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-phishing_pass}
      POSTGRES_DB: phishing_guard
    expose:
      - "5432"                  # Internal only
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phishing_user -d phishing_guard"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pg_data:
  uploads_data:
  model_data:
  frontend_dist:
